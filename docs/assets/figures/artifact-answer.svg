<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><rect width="600" height="360" rx="20" fill="#191919"/><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".6" fill="#ffffff" opacity=".10"/></pattern></defs><rect width="600" height="360" fill="url(#grid)"/><title>Illustrative evidence-bound answer packet</title><rect x="55" y="42" width="490" height="276" rx="15" fill="#222222" stroke="#424242"/><circle cx="82" cy="66" r="4" fill="#ccffa0"/><text x="96" y="70" fill="#ccffa0" font-size="10" font-family="IBM Plex Mono,monospace">QUESTION → EVIDENCE → ANSWER</text><path d="M78 91h444" stroke="#404040"/><text x="80" y="126" fill="#efefef" font-size="17" font-family="Inter,Segoe UI,sans-serif">What changes in the feedback loop?</text><text x="80" y="158" fill="#aaa" font-size="12" font-family="Inter,Segoe UI,sans-serif">Retrieve the mechanism, protocol and limits.</text><path d="M80 182h404m-404 17h373m-373 17h320" stroke="#545454" stroke-width="3" stroke-linecap="round"/><rect x="78" y="239" width="445" height="54" rx="8" fill="#ccffa00a" stroke="#ccffa030"/><text x="92" y="260" fill="#ccffa0" font-size="10" font-family="IBM Plex Mono,monospace">CITATION / VERSION / LOCATOR</text><text x="92" y="280" fill="#b4b4b4" font-size="11" font-family="Inter,Segoe UI,sans-serif">Applicable conditions · explicit gaps · bounded claims</text></svg>