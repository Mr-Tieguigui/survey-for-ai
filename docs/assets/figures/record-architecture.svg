<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610"><title>Record-level evidence architecture</title><desc>Work identities and actual source manifestations support role-specific evidence and bounded claims. Typed links and reader modules reuse admitted claims to form traceable answer packets. Dashed links show selective maintenance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3d6c0d"/></marker></defs><rect width="1280" height="610" rx="22" fill="#ffffff"/><path d="M286 157C369.5 157 369.5 254 453 254" fill="none" stroke="#3d6c0d" stroke-opacity=".75" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M286 387C369.5 387 369.5 314 453 314" fill="none" stroke="#3d6c0d" stroke-opacity=".75" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M805 254C890.0 254 890.0 157 975 157" fill="none" stroke="#3d6c0d" stroke-opacity=".75" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M805 314C890.0 314 890.0 387 975 387" fill="none" stroke="#3d6c0d" stroke-opacity=".75" stroke-width="1.7" marker-end="url(#arrow)"/><g transform="translate(30 78)"><rect width="256" height="152" rx="15" fill="#f7f8fa" stroke="#dde2e9" stroke-width="1"/><text x="24" y="30" fill="#3d6c0d" font-size="11" font-family="IBM Plex Mono,monospace">01 / IDENTITY</text><text x="24" y="62" fill="#1a1f2c" font-size="21" font-family="Inter,Segoe UI,sans-serif">Work family</text><text x="24" y="91" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Stable identity · role</text><text x="24" y="113" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Aliases and versions kept</text></g><g transform="translate(30 308)"><rect width="256" height="172" rx="15" fill="#f7f8fa" stroke="#dde2e9" stroke-width="1"/><text x="24" y="30" fill="#3d6c0d" font-size="11" font-family="IBM Plex Mono,monospace">02 / SOURCE</text><text x="24" y="62" fill="#1a1f2c" font-size="21" font-family="Inter,Segoe UI,sans-serif">Source manifestation</text><text x="24" y="91" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Actual URL + observed version</text><text x="24" y="113" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Body locator + reviewed scope</text><text x="24" y="135" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Metadata is not claim admission</text></g><g transform="translate(453 192)"><rect width="352" height="190" rx="15" fill="#f7f8fa" stroke="#3d6c0d" stroke-width="1.5"/><text x="24" y="30" fill="#3d6c0d" font-size="11" font-family="IBM Plex Mono,monospace">03 / EVIDENCE PERMISSION</text><text x="24" y="62" fill="#1a1f2c" font-size="21" font-family="Inter,Segoe UI,sans-serif">Bounded claim</text><text x="24" y="91" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">What the source supports</text><text x="24" y="113" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Conditions · limits · provenance</text><text x="24" y="135" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Optional method configuration</text></g><g transform="translate(975 78)"><rect width="275" height="152" rx="15" fill="#f7f8fa" stroke="#dde2e9" stroke-width="1"/><text x="24" y="30" fill="#3d6c0d" font-size="11" font-family="IBM Plex Mono,monospace">04 / ORGANIZATION</text><text x="24" y="62" fill="#1a1f2c" font-size="21" font-family="Inter,Segoe UI,sans-serif">Typed links &amp; modules</text><text x="24" y="91" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Two-endpoint relation support</text><text x="24" y="113" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Vertical, horizontal, reader views</text></g><g transform="translate(975 308)"><rect width="275" height="172" rx="15" fill="#f7f8fa" stroke="#dde2e9" stroke-width="1"/><text x="24" y="30" fill="#3d6c0d" font-size="11" font-family="IBM Plex Mono,monospace">05 / RETRIEVAL</text><text x="24" y="62" fill="#1a1f2c" font-size="21" font-family="Inter,Segoe UI,sans-serif">Traceable answer</text><text x="24" y="91" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Claim IDs and exact citations</text><text x="24" y="113" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Comparison conditions and gaps</text><text x="24" y="135" fill="#657083" font-size="13" font-family="Inter,Segoe UI,sans-serif">Supported / partial / insufficient</text></g><path d="M1110 480V548H155V480" stroke="#3d6c0d" stroke-opacity=".5" stroke-dasharray="5 6" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="640" y="540" text-anchor="middle" fill="#657083" font-size="12" font-family="IBM Plex Mono,monospace">SELECTIVE MAINTENANCE · REPAIR AFFECTED RECORDS AND VIEWS</text><text x="30" y="32" fill="#657083" font-size="11" font-family="IBM Plex Mono,monospace">CONCEPTUAL SCHEMA · NOT AN EXPERIMENTAL RESULT</text></svg>