<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#768770" stroke-width="1.2"/></marker></defs><rect width="1600" height="830" rx="10" fill="#fcfbf7"/><g font-family="Arial,sans-serif"><text x="56" y="55" fill="#66715f" font-size="13" letter-spacing="2.5">FIGURE 1 / THE SURVEY FOR AI CONSTRUCTION AND RETRIEVAL MODEL</text><text x="56" y="103" font-family="Georgia,serif" font-size="32" fill="#26352b">Build once. Retrieve by question. Maintain by dependency.</text><path d="M56 133H1544" stroke="#d4dbce"/><text x="56" y="183" font-family="Georgia,serif" fill="#796884" font-size="26">A</text><text x="96" y="180" fill="#697763" font-size="12" letter-spacing="2">CONSTRUCT</text><text x="56" y="220" fill="#26352b" font-family="Georgia,serif" font-size="23">Domain-adapted curation</text><text x="568" y="183" font-family="Georgia,serif" fill="#796884" font-size="26">B</text><text x="608" y="180" fill="#697763" font-size="12" letter-spacing="2">ORGANIZE</text><text x="568" y="220" fill="#26352b" font-family="Georgia,serif" font-size="23">Multiple views, shared evidence</text><text x="1080" y="183" font-family="Georgia,serif" fill="#796884" font-size="26">C</text><text x="1120" y="180" fill="#697763" font-size="12" letter-spacing="2">RETRIEVE</text><text x="1080" y="220" fill="#26352b" font-family="Georgia,serif" font-size="23">Bounded answers for AI readers</text><rect x="56" y="254" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="76" y="286" fill="#293a2d" font-size="18">Domain adapter</text><text x="76" y="313" fill="#72806b" font-size="13">scope · roles · sources · cutoff</text><rect x="56" y="365" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="76" y="397" fill="#293a2d" font-size="18">Work + source identities</text><text x="76" y="424" fill="#72806b" font-size="13">stable IDs · observed versions</text><rect x="56" y="476" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="76" y="508" fill="#293a2d" font-size="18">Role evidence + dossiers</text><text x="76" y="535" fill="#72806b" font-size="13">bounded claims · locators · limits</text><rect x="568" y="254" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="588" y="286" fill="#293a2d" font-size="18">Branches + typed relations</text><text x="588" y="313" fill="#72806b" font-size="13">navigation tree · supported cross-links</text><rect x="568" y="365" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="588" y="397" fill="#293a2d" font-size="18">Multi-view synthesis</text><text x="588" y="424" fill="#72806b" font-size="13">vertical · horizontal · mechanism · frontier</text><rect x="568" y="476" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="588" y="508" fill="#293a2d" font-size="18">Reader modules</text><text x="588" y="535" fill="#72806b" font-size="13">goal · question · evidence · conditions</text><rect x="1080" y="254" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="1100" y="286" fill="#293a2d" font-size="18">Reader request</text><text x="1100" y="313" fill="#72806b" font-size="13">intent · task · depth · evidence need</text><rect x="1080" y="365" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="1100" y="397" fill="#293a2d" font-size="18">Targeted evidence packet</text><text x="1100" y="424" fill="#72806b" font-size="13">selected module → claims → sources</text><rect x="1080" y="476" width="460" height="84" rx="5" fill="#f3f5ed" stroke="#cbd5c3"/><text x="1100" y="508" fill="#293a2d" font-size="18">Supported answer</text><text x="1100" y="535" fill="#72806b" font-size="13">conclusion · citations · limits · gaps</text><path d="M286 338V363" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M286 449V474" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M798 338V363" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M798 449V474" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M1310 338V363" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M1310 449V474" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M516 518H568M1028 518H1080" stroke="#7e8d76" fill="none" marker-end="url(#arrow)"/><path d="M1310 560V612H285V568" stroke="#8d7a94" stroke-dasharray="5 6" fill="none" marker-end="url(#arrow)"/><text x="590" y="640" font-size="13" fill="#8b7690">VERSION CHANGES → AFFECTED CLAIMS / RELATIONS / MODULES ONLY</text><rect x="56" y="685" width="1488" height="85" rx="5" fill="#efedf2" stroke="#d8d0de"/><text x="77" y="717" font-size="13" fill="#6f5c7b">EVIDENCE PERMISSIONS</text><text x="77" y="746" font-size="15" fill="#5c5662">metadata / abstract ≠ technical citation permission</text><text x="830" y="717" font-size="13" fill="#6f5c7b">COMPLETION STATES</text><text x="830" y="746" font-size="15" fill="#5c5662">organized ≠ primary review complete ≠ method effectiveness validated</text><text x="56" y="802" font-size="11" fill="#84907d">Conceptual architecture. Arrows describe information flow; they do not imply a measured efficiency or accuracy improvement.</text></g></svg>